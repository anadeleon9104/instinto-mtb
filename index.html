<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="theme-color" content="#0b0f14">
  <title>Instinto MTB</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Russo+One&family=Rubik:wght@400;500;700&display=swap" rel="stylesheet">
  <style>
    html, body { margin: 0; height: 100%; background: #0b0f14; overflow: hidden; touch-action: none; -webkit-user-select: none; user-select: none; }
    #game { width: 100%; height: 100%; }
    #game canvas { display: block; }
    /* Aviso para girar el teléfono */
    #rotate {
      display: none; position: fixed; inset: 0; z-index: 10; background: #0b0f14; color: #fff;
      font-family: Rubik, Arial, sans-serif; text-align: center; padding: 24px; box-sizing: border-box;
      flex-direction: column; align-items: center; justify-content: center; gap: 16px;
    }
    #rotate .phone { width: 46px; height: 80px; border: 4px solid #8BE04E; border-radius: 10px; animation: turn 1.6s ease-in-out infinite; }
    #rotate h1 { font-family: "Russo One", Impact, sans-serif; font-weight: 400; font-size: 26px; margin: 0; }
    #rotate p { margin: 0; color: #9fb4c4; font-size: 15px; }
    @keyframes turn { 0%, 30% { transform: rotate(0deg); } 70%, 100% { transform: rotate(90deg); } }
    @media (orientation: portrait) and (pointer: coarse) { #rotate { display: flex; } }
  </style>
</head>
<body>
  <div id="game"></div>
  <div id="rotate">
    <div class="phone"></div>
    <h1>INSTINTO MTB</h1>
    <p>Gira tu teléfono para jugar en horizontal</p>
  </div>
  <script src="https://cdn.jsdelivr.net/npm/phaser@3.80.1/dist/phaser.min.js"></script>
  <script src="game.js"></script>
</body>
</html>
